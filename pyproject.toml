[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipool"
version = "0.1.0"
description = "A legitimate, token-aware distributed AI compute coordinator"
requires-python = ">=3.13"

[project.scripts]
aipool = "aipool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
